# Publica la maqueta navegable (carpeta maqueta/) en GitHub Pages.
# Solo se sube maqueta/: la documentación de docs/ no forma parte del sitio.
name: Publicar maqueta en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "maqueta/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Empaquetado y publicación van en jobs separados: si van juntos, la publicación a veces
# busca el paquete antes de que la API de GitHub lo registre («No artifacts named github-pages»).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar maqueta
        uses: actions/upload-pages-artifact@v5
        with:
          path: maqueta

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
