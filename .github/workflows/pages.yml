# Publica la maqueta navegable (carpeta maqueta/) en GitHub Pages.
# Solo se sube maqueta/: la documentación de docs/ no forma parte del sitio.
name: Publicar maqueta en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "maqueta/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar maqueta
        uses: actions/upload-pages-artifact@v3
        with:
          path: maqueta

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
