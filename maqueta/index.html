<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeoSalud · Servicio de Neonatología</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=7" />
</head>
<body>
  <div class="app-shell">
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>

    <aside class="rail" id="rail" aria-label="Navegación principal">
      <div class="rail-header">
        <button class="brand-btn" id="brand-btn" type="button" aria-label="NeoSalud, ir a Inicio">
          <span class="brand-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </span>
          <span class="brand-copy">
            <span class="brand-name">NeoSalud</span>
            <span class="brand-sub">Neonatología</span>
          </span>
        </button>
        <button class="icon-btn mobile-only" id="close-rail-btn" type="button" aria-label="Cerrar menú">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <nav class="rail-nav" id="rail-nav" aria-label="Secciones del sistema"></nav>

      <div class="rail-footer">
        <div class="env-pill" title="Entorno de demostración con datos ficticios">
          <span class="env-dot" aria-hidden="true"></span>
          <div>
            <strong>Entorno maqueta</strong>
            <span>Datos ficticios · Sin IA</span>
          </div>
        </div>
        <button class="rail-action" id="open-guide-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.8.8c0 1.7-2.3 2.1-2.3 3.7"/><circle cx="12" cy="17.3" r=".9" fill="currentColor" stroke="none"/></svg>
          Guion de recorridos
        </button>
        <button class="rail-action" id="reset-demo-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Reiniciar maqueta
        </button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="open-rail-btn" type="button" aria-label="Abrir menú" aria-controls="rail">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="breadcrumb" id="breadcrumb"></div>
        </div>

        <div class="topbar-right">
          <button class="role-trigger" id="role-trigger" type="button" aria-haspopup="dialog">
            <span class="role-avatar" id="role-avatar">ET</span>
            <span class="role-meta">
              <span class="role-name" id="role-name">Dra. Elena Torres</span>
              <span class="role-label" id="role-label">Neonatóloga de planta</span>
            </span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </header>

      <div class="patient-strip" id="patient-strip" hidden></div>

      <main class="main-canvas" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="modal-close" type="button" aria-label="Cerrar ventana">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="./data.js?v=7"></script>
  <script src="./engine.js?v=7"></script>
  <script src="./schema.js?v=7"></script>
  <script src="./app.js?v=7"></script>
</body>
</html>
